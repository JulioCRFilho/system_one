[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system1_engine"
version = "0.1.0"
description = "Universal System 1 RL Agent Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "gymnasium[classic-control]>=0.29.0",
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
