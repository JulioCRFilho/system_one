[package]
name = "system1_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Core Simulation and Decision Engine for System 1"

[lib]
name = "system1_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
